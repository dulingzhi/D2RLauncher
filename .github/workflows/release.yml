name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Set UTF-8 encoding
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $PSDefaultParameterValues['Out-File:Encoding'] = 'utf8'

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史以生成 changelog

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install

      - name: Build Tauri app (includes frontend build)
        run: bunx @tauri-apps/cli build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Install UPX
        run: |
          $upxVersion = "4.2.4"
          $upxUrl = "https://github.com/upx/upx/releases/download/v$upxVersion/upx-$upxVersion-win64.zip"
          Invoke-WebRequest -Uri $upxUrl -OutFile upx.zip
          Expand-Archive upx.zip -DestinationPath .
          Move-Item "upx-$upxVersion-win64\upx.exe" upx.exe

      - name: Compress with UPX and re-sign
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $exePath = "src-tauri\target\release\d2r-launcher.exe"
          $sigPath = "$exePath.sig"
          $originalSize = (Get-Item $exePath).Length
          Write-Host "Original size: $([math]::Round($originalSize/1MB, 2)) MB"

          .\upx.exe --best --lzma $exePath

          $compressedSize = (Get-Item $exePath).Length
          Write-Host "Compressed size: $([math]::Round($compressedSize/1MB, 2)) MB"
          Write-Host "Compression ratio: $([math]::Round(($originalSize - $compressedSize) / $originalSize * 100, 2))%"

          # UPX modifies the binary, so the old .sig no longer matches.
          # Generate a new Ed25519 signature for the compressed binary.
          # Write key to temp file (avoids shell escaping issues with multi-line keys)
          $tmpKey = [System.IO.Path]::GetTempFileName()
          $env:TAURI_PRIVATE_KEY | Out-File -FilePath $tmpKey -Encoding utf8 -NoNewline

          python scripts/sign-upx.py $exePath $tmpKey $env:TAURI_KEY_PASSWORD

          Remove-Item $tmpKey -Force

          if (!(Test-Path $sigPath)) {
            Write-Error "Signature file was not created!"
            exit 1
          }
          Write-Host "New signature: $(Get-Content $sigPath -Raw)"

      - name: Generate changelog
        id: changelog
        run: |
          # 获取上一个 tag
          $prevTag = git describe --tags --abbrev=0 HEAD^ 2>$null
          if ($LASTEXITCODE -ne 0) {
            # 如果是第一个 tag，从第一个 commit 开始
            $prevTag = git rev-list --max-parents=0 HEAD
          }
          
          # 生成 changelog（每行一个元素的数组）
          $changelogLines = git log "$prevTag..HEAD" --pretty=format:"- %s" --no-merges
          
          # 如果没有新提交，使用默认信息
          if ([string]::IsNullOrWhiteSpace($changelogLines)) {
            $changelogLines = "- 初始版本发布"
          }
          
          # 将数组转换为带换行符的字符串
          $changelogText = $changelogLines -join "`n"
          
          # 保存 changelog（用于 latest.json）
          $changelogText | Out-File -FilePath changelog.txt -Encoding utf8
          
          # 生成完整的 release body
          $version = "${{ github.ref_name }}"
          
          # 使用 StringBuilder 构建 release body 以确保换行符正确
          $releaseBody = "## D2R CN 多开启动器 $version`n`n"
          $releaseBody += "### 更新内容`n"
          $releaseBody += $changelogText + "`n`n"
          $releaseBody += "### 下载说明`n"
          $releaseBody += "- Windows 用户请下载 ``d2r-launcher.exe`` 文件，无需安装直接运行`n"
          $releaseBody += "- **已使用 UPX 压缩**，体积约 4 MB，启动速度不受影响`n"
          $releaseBody += "- 首次运行需要设置游戏路径`n"
          $releaseBody += "- 程序支持自动更新，下次有新版本会自动提示`n`n"
          $releaseBody += "### 系统要求`n"
          $releaseBody += "- Windows 10/11 x64"
          
          # 保存 release body 到文件
          $releaseBody | Out-File -FilePath release-body.txt -Encoding utf8
          Write-Host "Generated release body:"
          Get-Content release-body.txt

      - name: Generate latest.json for Tauri updater
        run: |
          $version = "${{ github.ref_name }}"
          $exePath = "src-tauri\target\release\d2r-launcher.exe"
          $sigPath = "$exePath.sig"
          
          # 读取签名文件
          if (Test-Path $sigPath) {
            $signature = Get-Content $sigPath -Raw
            if ([string]::IsNullOrWhiteSpace($signature)) {
              Write-Error "Signature file exists but is empty!"
              exit 1
            }
          } else {
            Write-Error "Signature file not found at $sigPath - updater will not work without it!"
            exit 1
          }
          
          # 读取 changelog
          $notes = Get-Content changelog.txt -Raw -Encoding utf8
          
          # 获取当前 UTC 时间
          $pubDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          
          # 生成 JSON
          $json = @{
            version = $version
            notes = $notes
            pub_date = $pubDate
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature.Trim()
                url = "https://github.com/dulingzhi/D2RLauncher/releases/download/$version/d2r-launcher.exe"
              }
            }
          } | ConvertTo-Json -Depth 10
          
          # 保存到文件
          $json | Out-File -FilePath latest.json -Encoding utf8
          Write-Host "Generated latest.json:"
          Get-Content latest.json

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: false
          files: |
            src-tauri/target/release/d2r-launcher.exe
            latest.json
          body_path: release-body.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
