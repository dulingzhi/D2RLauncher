name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install

      - name: Build frontend
        run: bun run build

      - name: Build Tauri app
        run: |
          cd src-tauri
          cargo build --release --verbose
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Install UPX
        run: |
          $upxVersion = "4.2.4"
          $upxUrl = "https://github.com/upx/upx/releases/download/v$upxVersion/upx-$upxVersion-win64.zip"
          Invoke-WebRequest -Uri $upxUrl -OutFile upx.zip
          Expand-Archive upx.zip -DestinationPath .
          Move-Item "upx-$upxVersion-win64\upx.exe" upx.exe

      - name: Compress with UPX
        run: |
          $exePath = "src-tauri\target\release\d2r-launcher.exe"
          $originalSize = (Get-Item $exePath).Length
          Write-Host "Original size: $([math]::Round($originalSize/1MB, 2)) MB"
          
          .\upx.exe --best --lzma $exePath
          
          $compressedSize = (Get-Item $exePath).Length
          Write-Host "Compressed size: $([math]::Round($compressedSize/1MB, 2)) MB"
          Write-Host "Compression ratio: $([math]::Round(($originalSize - $compressedSize) / $originalSize * 100, 2))%"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          files: |
            src-tauri/target/release/d2r-launcher.exe
          body: |
            ## D2R CN 多开启动器 ${{ github.ref_name }}
            
            ### 新功能
            - 请在此处添加版本更新说明
            
            ### 下载说明
            - Windows 用户请下载 `d2r-launcher.exe` 文件，无需安装直接运行
            - **已使用 UPX 压缩**，体积更小，启动速度不受影响
            - 首次运行需要设置游戏路径
            
            ### 系统要求
            - Windows 10/11 x64
            - 暗黑破坏神II：重制版（国服）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
